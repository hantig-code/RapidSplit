plugins {
    id 'com.android.application'
}

android {
    namespace 'app.rapidsplit'
    compileSdk 34

    defaultConfig {
        applicationId "app.rapidsplit"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "3.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // PNG-Crunching aus: macOS- und Linux-aapt2 komprimieren unterschiedlich,
            // das bricht F-Droids byte-genauen Reproducible-Build-Vergleich.
            crunchPngs false
        }
    }

    // Kein verschlüsselter Google-Play-Abhängigkeitsblock in der APK —
    // Voraussetzung für F-Droids Reproducible Builds (byte-identischer Nachbau).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Keine Abhängigkeiten: reiner Android-Framework-Wrapper (WebView) um die Offline-PWA in assets/.
dependencies {
}
